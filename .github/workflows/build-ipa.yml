name: Build 4ppst0r3 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project 4ppst0r3.xcodeproj \
            -scheme 4ppst0r3 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/4ppst0r3.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload 4ppst0r3.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 4ppst0r3-unsigned-ipa
          path: 4ppst0r3.ipa
          if-no-files-found: error
          retention-days: 7
